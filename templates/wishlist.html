{% extends "base.html" %}
{% block nav_action %}<a href="/wishlist/add" class="bg-rose-600 hover:bg-rose-500 text-white px-4 py-1.5 rounded-md text-sm font-medium transition-colors">+ Add to Wishlist</a>{% endblock %}
{% block content %}

<form hx-get="/wishlist"
      hx-target="#wishlist-grid"
      hx-trigger="input changed delay:300ms from:input[name='q'], change from:select"
      class="flex flex-col sm:flex-row gap-3 mb-6">
    <input type="text" name="q" value="{{ q }}"
           placeholder="Search artist or title..."
           class="flex-1 bg-zinc-800 border border-zinc-700 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-rose-500 placeholder-zinc-500">
    <select name="genre"
            class="bg-zinc-800 border border-zinc-700 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-rose-500 text-zinc-100">
        <option value="">All genres</option>
        {% for g in genres %}
        <option value="{{ g }}" {% if g == selected_genre %}selected{% endif %}>{{ g }}</option>
        {% endfor %}
    </select>
    <select name="artist"
            class="bg-zinc-800 border border-zinc-700 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-rose-500 text-zinc-100">
        <option value="">All artists</option>
        {% for a in artists %}
        <option value="{{ a }}" {% if a == selected_artist %}selected{% endif %}>{{ a }}</option>
        {% endfor %}
    </select>
</form>

<div id="wishlist-grid">
    {% include "partials/wishlist_list.html" %}
</div>

{% endblock %}
