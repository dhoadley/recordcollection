<div class="fixed inset-0 bg-black/75 z-40 flex items-end sm:items-center justify-center p-0 sm:p-4"
     onclick="if(event.target===this)closeModal()">
    <div class="bg-zinc-800 rounded-t-2xl sm:rounded-xl overflow-hidden w-full sm:max-w-sm"
         onclick="event.stopPropagation()">
        <div class="relative">
            {% if album.cover_art_url %}
            <img src="{{ album.cover_art_url }}" alt="{{ album.title }}"
                 class="w-full object-cover max-h-64 sm:max-h-72">
            {% else %}
            <div class="w-full h-48 bg-zinc-700 flex items-center justify-center">
                <span class="text-zinc-500 text-6xl font-display tracking-widest">LP</span>
            </div>
            {% endif %}
            <button hx-get="/records/{{ album.id }}/art-search"
                    hx-target="#art-modal"
                    hx-swap="innerHTML"
                    class="absolute bottom-2 left-2 bg-black/50 hover:bg-black/70 text-white text-xs px-2 py-1 rounded-md transition-colors">
                Change art
            </button>
            <button onclick="closeModal()"
                    class="absolute top-3 right-3 bg-black/50 hover:bg-black/70 text-white rounded-full w-8 h-8 flex items-center justify-center text-lg leading-none transition-colors">
                &times;
            </button>
        </div>

        <div class="p-5">
            <h2 class="font-display text-2xl tracking-wide leading-tight">{{ album.title }}</h2>
            <p class="text-zinc-300 mt-1">{{ album.artist }}</p>
            <div class="flex gap-3 mt-2 text-sm text-zinc-500">
                {% if album.year %}<span>{{ album.year }}</span>{% endif %}
                {% if album.genre %}<span>{{ album.genre }}</span>{% endif %}
            </div>
        </div>

        <div class="px-5 pb-5 flex items-center justify-between border-t border-zinc-700 pt-4">
            <form method="POST" action="/records/{{ album.id }}/delete"
                  onsubmit="return confirm('Remove this record from your collection?')">
                <button type="submit" class="text-red-400 hover:text-red-300 text-sm transition-colors">
                    Remove
                </button>
            </form>
            <button onclick="closeModal()" class="text-zinc-400 hover:text-white text-sm transition-colors">
                Close
            </button>
        </div>
    </div>
</div>
