{% if covers %}
<div class="grid grid-cols-3 sm:grid-cols-4 gap-2">
    {% for cover in covers %}
    <button type="button"
            onclick="selectArt('{{ table }}', {{ id }}, '{{ cover.full }}')"
            class="aspect-square rounded-lg overflow-hidden hover:ring-2 hover:ring-rose-500 transition-all focus:outline-none">
        <img src="{{ cover.thumb }}" alt=""
             class="w-full h-full object-cover"
             onerror="this.closest('button').style.display='none'">
    </button>
    {% endfor %}
</div>
{% else %}
<p class="text-zinc-500 text-sm text-center py-4">No results found.</p>
{% endif %}
