<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My Records{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['"Bebas Neue"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js"></script>
</head>
<body class="bg-zinc-900 text-zinc-100 min-h-screen font-sans" style="overflow-x: clip; overscroll-behavior-x: none;">
    <header class="bg-zinc-950 sticky top-0 z-10 shadow-xl shadow-black/50">
        <div class="h-0.5 bg-gradient-to-r from-rose-700 via-rose-400 to-rose-700"></div>
        <div class="max-w-5xl mx-auto px-4 py-3 flex flex-wrap items-center gap-y-2">
            <a href="/" class="flex items-center gap-3">
                <svg class="w-7 h-7 text-rose-400 flex-shrink-0" viewBox="0 0 24 24" fill="currentColor">
                    <circle cx="12" cy="12" r="11" opacity="0.15"/>
                    <circle cx="12" cy="12" r="11" fill="none" stroke="currentColor" stroke-width="1.5"/>
                    <circle cx="12" cy="12" r="7.5" fill="none" stroke="currentColor" stroke-width="0.6" opacity="0.45"/>
                    <circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="0.6" opacity="0.45"/>
                    <circle cx="12" cy="12" r="2.5" opacity="0.65"/>
                    <circle cx="12" cy="12" r="1" fill="#09090b"/>
                </svg>
                <span class="font-display text-2xl tracking-wider text-white leading-none">My Records</span>
            </a>
            <div class="flex items-center gap-4 ml-auto">
                <nav class="flex items-center gap-1">
                    <a href="/" class="px-3 py-1.5 rounded-md text-sm font-medium transition-colors {% if request.path == '/' or request.path.startswith('/records') or request.path == '/add' %}text-white bg-zinc-800{% else %}text-zinc-400 hover:text-white{% endif %}">Collection</a>
                    <a href="/wishlist" class="px-3 py-1.5 rounded-md text-sm font-medium transition-colors {% if request.path.startswith('/wishlist') %}text-white bg-zinc-800{% else %}text-zinc-400 hover:text-white{% endif %}">Wishlist</a>
                </nav>
                {% block nav_action %}{% endblock %}
                <form method="POST" action="/logout">
                    <button type="submit" class="text-zinc-500 hover:text-zinc-300 text-sm transition-colors">Log out</button>
                </form>
            </div>
        </div>
    </header>
    <main class="max-w-5xl mx-auto px-4 py-6">
        {% block content %}{% endblock %}
    </main>
    <div id="modal-container"></div>
    <script>
        function closeModal() {
            document.getElementById('modal-container').innerHTML = '';
            document.body.style.overflow = '';
        }
        document.getElementById('modal-container').addEventListener('htmx:afterSettle', function() {
            if (this.innerHTML.trim()) document.body.style.overflow = 'hidden';
        });
    </script>
</body>
</html>
