{% extends "base.html" %}
{% block title %}Add Record — My Records{% endblock %}
{% block content %}

<div class="max-w-lg mx-auto">
    <h1 class="text-xl font-bold mb-6">Add a Record</h1>

    <div class="mb-6">
        <label class="block text-sm font-medium text-zinc-400 mb-1.5">Search Apple Music</label>
        <input type="text"
               name="q"
               placeholder="Type artist or album title..."
               autocomplete="off"
               class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-rose-500 placeholder-zinc-500"
               hx-get="/itunes-search"
               hx-target="#search-results"
               hx-trigger="input changed delay:400ms">
        <div id="search-results" class="mt-2"></div>
    </div>

    <form method="POST" action="/add" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-zinc-400 mb-1.5" for="artist">Artist</label>
            <input type="text" id="artist" name="artist" required
                   class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-rose-500 placeholder-zinc-500"
                   placeholder="Artist name">
        </div>
        <div>
            <label class="block text-sm font-medium text-zinc-400 mb-1.5" for="title">Album Title</label>
            <input type="text" id="title" name="title" required
                   class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-rose-500 placeholder-zinc-500"
                   placeholder="Album title">
        </div>
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-zinc-400 mb-1.5" for="year">Year</label>
                <input type="number" id="year" name="year" min="1900" max="2099"
                       class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-rose-500 placeholder-zinc-500"
                       placeholder="Year">
            </div>
            <div>
                <label class="block text-sm font-medium text-zinc-400 mb-1.5" for="genre">Genre</label>
                <input type="text" id="genre" name="genre"
                       class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-rose-500 placeholder-zinc-500"
                       placeholder="Genre">
            </div>
        </div>

        <input type="hidden" id="cover_art_url" name="cover_art_url">

        <div id="art-preview" class="hidden">
            <label class="block text-sm font-medium text-zinc-400 mb-1.5">Cover Art</label>
            <img id="art-img" src="" alt="Cover art" class="w-24 h-24 rounded-lg object-cover">
        </div>

        <div class="flex gap-3 pt-2">
            <button type="submit"
                    class="flex-1 bg-rose-600 hover:bg-rose-500 text-white py-2.5 rounded-lg font-medium transition-colors">
                Save Record
            </button>
            <a href="/"
               class="px-6 py-2.5 border border-zinc-700 rounded-lg text-zinc-400 hover:text-white hover:border-zinc-500 transition-colors text-center">
                Cancel
            </a>
        </div>
    </form>
</div>

<script>
function selectAlbum(el) {
    document.getElementById('artist').value = el.dataset.artist;
    document.getElementById('title').value = el.dataset.title;
    document.getElementById('year').value = el.dataset.year;
    document.getElementById('genre').value = el.dataset.genre;
    document.getElementById('cover_art_url').value = el.dataset.art;

    const preview = document.getElementById('art-preview');
    const img = document.getElementById('art-img');
    if (el.dataset.art) {
        img.src = el.dataset.art;
        preview.classList.remove('hidden');
    } else {
        preview.classList.add('hidden');
    }

    document.getElementById('search-results').innerHTML = '';
}
</script>

{% endblock %}
